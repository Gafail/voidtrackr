# voidtrackr — the audio-to-MIDI converter.
#
# This container serves exactly one site, so this server block is the only
# one: it is the default server and answers every request on port 80.
#
# The site is static. All the work happens in the browser — the model weights
# are fetched from this same origin and run through WebAssembly, so a
# recording never leaves the machine it was opened on.
#
# LAN only for now: there is no domain, so it is reached by IP or by a name
# the client resolves itself. When a domain arrives, add it to server_name
# and point a Cloudflare Tunnel at this port.
#
# The address in server_name is the RFC 5737 documentation address
# 192.0.2.0. It is deliberately NOT a real address: deploy.sh substitutes the
# real one at deploy time, so a checked-in config can never point at a
# machine that is already serving something else.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 192.0.2.0 voidtrackr voidtrackr.local _;

    root /var/www/voidtrackr;
    index index.html;

    access_log /var/log/webapps/voidtrackr.access.log;
    error_log  /var/log/webapps/voidtrackr.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # Void* security headers, with a CSP written for this site.
    #
    # The shared snippet's generic CSP blocks WebAssembly, and the Okarina
    # model runs through WebAssembly, so this site carries its own. See
    # ops/nginx/voidtrackr-headers.conf for why each piece is there.
    include /etc/nginx/snippets/voidtrackr-headers.conf;

    # Cache rules
    #
    # Use `expires`, not `add_header Cache-Control`. An `add_header` inside a
    # location block discards every `add_header` inherited from the server
    # block — which would silently drop the security headers above on those
    # locations, and emit a second, conflicting Cache-Control header.
    location = /index.html {
        expires 60s;
    }

    location = /404.html {
        internal;
    }

    # Vite writes content-hashed filenames into /assets, so these can be
    # cached for as long as the browser likes: a new build produces a new
    # name and never overwrites an old one.
    location /assets/ {
        expires 1y;
    }

    # The WebAssembly runtime. The filename carries the runtime's own build
    # hash, so it is stable until the runtime is upgraded.
    #
    # The `types` block replaces the inherited MIME map for this location, so
    # it names every type this one can serve. Ubuntu's mime.types has no entry
    # for `.mjs`, which would leave it as application/octet-stream — and a
    # browser refuses to run a module script with the wrong MIME type, with or
    # without `nosniff`. The ONNX runtime would fail to load with "no
    # available backend found" and the app would sit there doing nothing.
    location /ort/ {
        types {
            application/javascript  mjs;
            application/wasm        wasm;
        }
        expires 7d;
    }

    # The model weights. These are pinned by SHA-256 and rarely change, but
    # their names are not hashed — a week is long enough to stop a stale
    # weight from lingering after a model is updated, and short enough not
    # to matter on a LAN.
    location ~* ^/(model|model-onnx)/ {
        expires 7d;
    }

    location = /robots.txt {
        expires 1h;
    }

    # The API.
    #
    # The site is static and the browser does the work, but a tool that is
    # driven from a script needs an address to call. The API is a small Node
    # process on this box, listening on 127.0.0.1, and nginx is the only
    # thing that can reach it.
    #
    # The proxy keeps the original path, so the API answers at /api/convert
    # exactly as it is written in the source.
    #
    # `client_max_body_size` has to be at least as large as the API's own
    # limit, or nginx refuses the upload before the API sees it. The API's
    # limit is VOIDTRACKR_MAX_UPLOAD, in megabytes.
    #
    # The timeouts are long because a conversion of a long recording takes a
    # while: the model runs on two cores here, and a three-minute song takes
    # minutes rather than seconds.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        client_max_body_size 100m;
        proxy_request_buffering on;

        # The API's own errors are JSON and say what went wrong. nginx must
        # pass them through rather than swapping them for the site's 404
        # page, which is what `error_page 404 /404.html` would otherwise do.
        proxy_intercept_errors off;
    }

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
