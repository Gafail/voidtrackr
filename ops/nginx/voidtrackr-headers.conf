# voidtrackr — security headers.
#
# This is the shared Void* set (ops/nginx-snippets/security-headers.conf in
# the umbrella repo) with one change: the Content-Security-Policy.
#
# The generic CSP is:
#
#   script-src 'self'
#
# which blocks WebAssembly outright — `WebAssembly.compile` and
# `WebAssembly.instantiate` are script evaluation as far as the CSP is
# concerned. The Okarina model runs entirely in WebAssembly, so without
# 'wasm-unsafe-eval' the second model simply cannot load and the app fails
# with an error the user cannot act on.
#
# A second Content-Security-Policy header cannot be sent alongside the
# generic one: the browser enforces every policy it receives and applies the
# strictest of them, so sending both would block WebAssembly anyway. That is
# why this site carries its own header file rather than including the shared
# snippet and adding to it.
#
# Installed as /etc/nginx/snippets/voidtrackr-headers.conf.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

# Everything the site loads comes from its own origin. There is no CDN, no
# third-party asset, no inline script and no inline event handler.
#
#   script-src 'wasm-unsafe-eval'     the Okarina model is WebAssembly. The
#                                     browser treats WebAssembly.compile and
#                                     WebAssembly.instantiate as script
#                                     evaluation, so without this the model
#                                     cannot load at all.
#   worker-src 'self' blob:            the runtime may run its worker from a
#                                     blob URL.
#   media-src 'self' blob:             the original recording is played back
#                                     from a blob URL the page created.
#   style-src 'unsafe-inline'          React writes the progress bar's width
#                                     as an inline style attribute.
#   frame-src 'none'                   nothing is framed.
#   object-src 'none'                  nothing is embedded.
#   base-uri 'none'                    no <base> rewriting.
#   form-action 'none'                 the app has no forms and posts nothing.
#
# There is deliberately no 'wasm-unsafe-streaming': only Firefox knows that
# source expression, and Chrome logs "invalid source ... It will be ignored"
# for it on every page load. Chrome's 'wasm-unsafe-eval' already covers
# streaming compilation.

add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
