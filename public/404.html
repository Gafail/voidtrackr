<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>voidtrackr — not found</title>
    <style>
      :root {
        color-scheme: dark;
        --void-900: #07070b;
        --ink: #ecebf5;
        --ink-2: #a7a4bd;
        --ink-3: #74718c;
        --accent: #8b7bf7;
        --font-sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--void-900);
        color: var(--ink-2);
        font-family: var(--font-sans);
        line-height: 1.6;
      }
      main {
        padding: 2rem;
        max-width: 34rem;
        text-align: center;
      }
      .kicker {
        color: var(--ink-3);
        font-family: var(--font-mono);
        font-size: 0.75rem;
        letter-spacing: 0.08em;
      }
      .kicker span {
        color: var(--accent);
      }
      h1 {
        color: var(--ink);
        font-size: 1.6rem;
        font-weight: 600;
        margin: 0.5rem 0 0.75rem;
      }
      p {
        margin: 0 0 1.5rem;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker"><span>//</span> voidtrackr</p>
      <h1>Nothing here.</h1>
      <p>
        That path does not exist. The converter is on the front page — drop a

      <p><a href="/">Back to voidtrackr</a></p>
